name: Terraria 24/7 Dedicated Server

on:
  workflow_dispatch:
    inputs:
      server_mode:
        description: 'Server Mode (vanilla-1461 = Official 1.4.6.1, tmodloader = Modded with MagicStorage/BossChecklist/RecipeBrowser)'
        required: true
        type: choice
        options:
          - vanilla-1461
          - tmodloader
        default: vanilla-1461
      world_name:
        description: 'World Name'
        required: true
        default: 'FilmFeed_Large_World'
      world_size:
        description: 'World Size (3 = Large, 2 = Medium, 1 = Small)'
        required: true
        type: choice
        options:
          - '3'
          - '2'
          - '1'
        default: '3'
      difficulty:
        description: 'Difficulty (0 = Classic, 1 = Expert, 2 = Master, 3 = Journey)'
        required: true
        type: choice
        options:
          - '1'
          - '0'
          - '2'
          - '3'
        default: '1'
      seed:
        description: 'Optional Special Seed (e.g. getfixedboi, fortheworthy, 05162020 - leave empty for normal)'
        required: false
        default: ''
      tunnel_provider:
        description: 'Free Tunnel Provider (bore = 100% Free Zero Setup, pinggy = Free SSH, playit = Free Claim Link)'
        required: true
        type: choice
        options:
          - bore
          - pinggy
          - playit
        default: bore
      auto_restart:
        description: 'Enable 24/7 Infinite Auto-Restart Loop'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [restart_terraria_server]

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: terraria-active-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Repository with World Saves
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Install Cloud Runner Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl unzip jq libatomic1 netcat-openbsd coreutils openssh-client

      - name: 🧩 Setup .NET 8 Runtime (tModLoader Mode)
        if: github.event.inputs.server_mode == 'tmodloader'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🎮 Launch Terraria Dedicated Server & Free Tunnel
        env:
          SERVER_MODE: ${{ github.event.inputs.server_mode || 'vanilla-1461' }}
          TERRARIA_VERSION: '1461'
          WORLD_NAME: ${{ github.event.inputs.world_name || 'FilmFeed_Large_World' }}
          WORLD_SIZE: ${{ github.event.inputs.world_size || '3' }}
          DIFFICULTY: ${{ github.event.inputs.difficulty || '1' }}
          WORLD_SEED: ${{ github.event.inputs.seed || '' }}
          TUNNEL_PROVIDER: ${{ github.event.inputs.tunnel_provider || 'bore' }}
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/start_server.sh scripts/tunnel.sh
          ./scripts/start_server.sh

      - name: 💾 Save & Push Persistent World Files
        if: always()
        run: |
          git config --global user.name "Terraria-Cloud-Bot"
          git config --global user.email "bot@terraria-server.cloud"
          git add worlds/ mods/
          if git status --porcelain worlds/ mods/ | grep -qE 'worlds/|mods/'; then
            git commit -m "chore(save): auto-save world state [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin main || (git pull --rebase origin main && git push origin main)
            echo "✅ World save pushed to GitHub!"
          else
            echo "ℹ️ No world changes detected."
          fi

      - name: 🔄 Trigger Next 24/7 Loop Cycle
        if: always() && !cancelled() && (github.event.inputs.auto_restart != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_MODE: ${{ github.event.inputs.server_mode || 'vanilla-1461' }}
          IN_WORLD: ${{ github.event.inputs.world_name || 'FilmFeed_Large_World' }}
          IN_SIZE: ${{ github.event.inputs.world_size || '3' }}
          IN_DIFF: ${{ github.event.inputs.difficulty || '1' }}
          IN_SEED: ${{ github.event.inputs.seed || '' }}
          IN_TUNNEL: ${{ github.event.inputs.tunnel_provider || 'bore' }}
        run: |
          echo "🚀 Dispatching next 24/7 server cycle..."
          sleep 3
          PAYLOAD=$(jq -n \
            --arg mode "$IN_MODE" \
            --arg world "$IN_WORLD" \
            --arg size "$IN_SIZE" \
            --arg diff "$IN_DIFF" \
            --arg seed "$IN_SEED" \
            --arg tunnel "$IN_TUNNEL" \
            '{ref:"main",inputs:{server_mode:$mode,world_name:$world,world_size:$size,difficulty:$diff,seed:$seed,tunnel_provider:$tunnel,auto_restart:"true"}}')
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/terraria_24_7.yml/dispatches" \
            -d "$PAYLOAD"
          echo "✅ Next 24/7 loop dispatched!"
